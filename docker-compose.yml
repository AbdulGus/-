services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: study_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/study_hub
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: change-this-demo-secret-key-change-this-demo-secret-key
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
