<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyHub — учебные курсы</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="header">
    <div>
        <h1>StudyHub</h1>
        <p>Простой каталог учебных курсов</p>
    </div>
    <button id="logoutButton" class="secondary hidden" type="button">Выйти</button>
</header>

<main class="container">
    <section id="authSection" class="card auth-card">
        <div class="tabs">
            <button id="loginTab" class="tab active" type="button">Вход</button>
            <button id="registerTab" class="tab" type="button">Регистрация</button>
        </div>

        <form id="loginForm">
            <h2>Войти в систему</h2>
            <label>Электронная почта
                <input id="loginEmail" type="email" required placeholder="student@example.com">
            </label>
            <label>Пароль
                <input id="loginPassword" type="password" required minlength="6">
            </label>
            <button type="submit">Войти</button>
        </form>

        <form id="registerForm" class="hidden">
            <h2>Создать аккаунт</h2>
            <label>Имя
                <input id="registerName" type="text" required minlength="2" maxlength="80">
            </label>
            <label>Электронная почта
                <input id="registerEmail" type="email" required>
            </label>
            <label>Пароль
                <input id="registerPassword" type="password" required minlength="6">
            </label>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </section>

    <section id="courseSection" class="hidden">
        <div class="welcome-row">
            <div>
                <h2>Учебные курсы</h2>
                <p id="userInfo" class="muted"></p>
            </div>
            <button id="refreshButton" class="secondary" type="button">Обновить</button>
        </div>

        <form id="courseForm" class="card">
            <h3>Новый курс</h3>
            <label>Название
                <input id="courseTitle" type="text" required maxlength="150">
            </label>
            <label>Описание
                <textarea id="courseDescription" required maxlength="1000" rows="4"></textarea>
            </label>
            <label class="checkbox">
                <input id="coursePublished" type="checkbox">
                Опубликовать курс
            </label>
            <button type="submit">Создать курс</button>
        </form>

        <div id="courseList" class="course-list"></div>
        <p id="emptyMessage" class="empty hidden">Курсов пока нет. Создайте первый курс.</p>
    </section>

    <p id="message" class="message hidden"></p>
</main>

<script src="/app.js"></script>
</body>
</html>
