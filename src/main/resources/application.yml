spring:
  application:
    name: study-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-demo-secret-key-change-this-demo-secret-key}
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.tutins: INFO
